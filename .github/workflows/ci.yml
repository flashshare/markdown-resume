on: push

jobs:
  build_and_test:
    runs-on: ubuntu-latest 
    name: Build and Test
    steps:
      - uses: actions/checkout@v4
      
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc wkhtmltopdf shellcheck
      
      - name: Run shellcheck
        run: |
          shellcheck ./compile.sh
          shellcheck ./compile_all.sh
          shellcheck ./watch.sh
      
      - name: Build CV files
        run: ./compile_all.sh
      
      - name: Verify output files exist
        run: |
          test -f ./output/sample.pdf || { echo "sample.pdf not found"; exit 1; }
          test -f ./output/sample.html || { echo "sample.html not found"; exit 1; }
          
      - name: Test clean operation
        run: |
          make clean
          test ! -f ./output/sample.pdf || { echo "sample.pdf not removed"; exit 1; }
          test ! -f ./output/sample.html || { echo "sample.html not removed"; exit 1; }
          
      - name: Rebuild for artifact
        run: ./compile_all.sh

      - uses: actions/upload-artifact@v4
        with:
          name: cv-outputs
          path: output/
          
      - name: Update repository with generated files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          git add ./output/*.pdf ./output/*.html
          if ! git diff --staged --quiet; then
            git commit -m "Update CV output files [CI]"
            git push
          else
            echo "No changes to commit."
          fi
